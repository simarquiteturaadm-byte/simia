<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Agente IA</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:        #00f0c8;
  --accent-dark:   #00b898;
  --accent-glow:   rgba(0,240,200,0.18);
  --accent-subtle: rgba(0,240,200,0.06);
  --bg:            #080c10;
  --bg2:           #0d1117;
  --surface:       #111820;
  --surface2:      #161e28;
  --border:        rgba(255,255,255,0.06);
  --border2:       rgba(255,255,255,0.10);
  --text:          #e8edf2;
  --text-muted:    #6a7a8a;
  --text-dim:      #3a4a5a;
  --font-mono:     'Courier New', monospace;
}

body {
  font-family: -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(var(--accent-subtle) 1px, transparent 1px),
    linear-gradient(90deg, var(--accent-subtle) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse 100% 80% at 50% 0%, black 40%, transparent 100%);
}

body::after {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; height: 1px; z-index: 0;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.5;
}

/* ===================== LOGIN SCREEN ===================== */
#loginScreen {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: var(--bg);
}

#loginScreen::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(var(--accent-subtle) 1px, transparent 1px),
    linear-gradient(90deg, var(--accent-subtle) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
}

/* Glow central */
#loginScreen::after {
  content: '';
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(0,240,200,0.06) 0%, transparent 70%);
  pointer-events: none;
}

.login-card {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 40px 36px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,240,200,0.05);
  overflow: hidden;
}

/* linha de acento no topo */
.login-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent-dark), transparent);
}

/* brilho no canto */
.login-card::after {
  content: '';
  position: absolute; top: -80px; right: -80px;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,240,200,0.08), transparent 70%);
  pointer-events: none;
}

.login-logo {
  display: block;
  height: 46px; width: auto;
  object-fit: contain;
  margin: 0 auto 28px;
}

.login-title {
  font-size: 18px; font-weight: 700;
  color: var(--text); text-align: center;
  margin-bottom: 6px; letter-spacing: -0.01em;
}

.login-sub {
  font-size: 12px; color: var(--text-muted);
  text-align: center; margin-bottom: 28px;
  font-family: var(--font-mono); letter-spacing: 0.03em;
}

.field { margin-bottom: 14px; }

.field label {
  display: block;
  font-size: 10px; font-family: var(--font-mono);
  color: var(--text-muted); margin-bottom: 6px;
  letter-spacing: 0.1em; text-transform: uppercase;
}

.field input {
  width: 100%; padding: 11px 14px;
  border-radius: 6px; border: 1px solid var(--border2);
  background: var(--surface2); color: var(--text);
  font-size: 14px; font-family: inherit;
  outline: none; transition: all 0.2s;
}
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
  background: rgba(22,30,40,0.9);
}
.field input::placeholder { color: var(--text-dim); }

.login-btn {
  width: 100%; padding: 12px;
  border-radius: 6px; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #080c10; font-size: 13px; font-weight: 700;
  font-family: var(--font-mono); letter-spacing: 0.08em;
  text-transform: uppercase; margin-top: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 20px var(--accent-glow);
}
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px var(--accent-glow); }
.login-btn:active { transform: translateY(0); }

.login-error {
  font-size: 11px; font-family: var(--font-mono);
  color: #ff5555; text-align: center;
  margin-top: 12px; min-height: 16px;
  letter-spacing: 0.04em;
  display: none;
}
.login-error.show { display: block; }

.login-footer {
  font-size: 9px; font-family: var(--font-mono);
  color: var(--text-dim); text-align: center;
  margin-top: 24px; letter-spacing: 0.06em;
}

/* shake animation */
@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.shake { animation: shake 0.4s ease; }

/* fade out login */
@keyframes fadeOut {
  to { opacity: 0; pointer-events: none; }
}
.fade-out { animation: fadeOut 0.5s ease forwards; }

/* ===================== HEADER ===================== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8,12,16,0.92);
  border-bottom: 1px solid var(--border2);
  backdrop-filter: blur(16px);
  padding: 0 24px; height: 60px;
  display: flex; align-items: center; gap: 14px;
}
.header::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.6;
}
.header-logo { height: 38px; width: auto; object-fit: contain; flex-shrink: 0; }
.header-sep { width: 1px; height: 28px; background: linear-gradient(to bottom, transparent, var(--border2), transparent); flex-shrink: 0; }
.header-info { flex: 1; }
.header-name { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0.04em; }
.header-sub {
  margin-top: 2px; font-size: 10px; color: var(--text-muted);
  font-family: var(--font-mono);
  display: flex; align-items: center; gap: 6px; letter-spacing: 0.04em;
}
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
  animation: pulseAnim 2.5s ease-in-out infinite;
}
@keyframes pulseAnim { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }
.header-badge {
  font-size: 9px; font-family: var(--font-mono); padding: 4px 10px; border-radius: 3px;
  background: var(--accent-subtle); color: var(--accent);
  border: 1px solid rgba(0,240,200,0.2); letter-spacing: 0.1em; text-transform: uppercase;
  flex-shrink: 0;
}

/* ===================== MAIN ===================== */
.main {
  flex: 1; position: relative; z-index: 1;
  max-width: 780px; width: 100%;
  margin: 0 auto; padding: 0 20px 130px;
}

/* chips */
.chips { padding: 16px 0 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 10px; font-family: var(--font-mono);
  padding: 5px 13px; border-radius: 3px;
  border: 1px solid var(--border2);
  background: var(--surface); color: var(--text-muted);
  cursor: pointer; transition: all 0.2s; letter-spacing: 0.04em;
}
.chip:hover {
  border-color: var(--accent); color: var(--accent);
  background: var(--accent-subtle);
  box-shadow: 0 0 12px var(--accent-glow);
}

/* welcome */
.welcome-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 8px; padding: 22px; margin: 8px 0;
  position: relative; overflow: hidden;
}
.welcome-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-dark), transparent);
}
.welcome-card::after {
  content: ''; position: absolute; top: -60px; right: -60px;
  width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle, var(--accent-glow), transparent 70%);
  pointer-events: none;
}
.welcome-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.welcome-sub { font-size: 13px; color: var(--text-muted); line-height: 1.75; }
.welcome-sub strong { color: var(--accent); font-weight: 500; }
.welcome-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.tag {
  font-size: 9px; font-family: var(--font-mono); padding: 3px 9px; border-radius: 2px;
  background: var(--accent-subtle); color: var(--accent);
  border: 1px solid rgba(0,240,200,0.15); letter-spacing: 0.08em; text-transform: uppercase;
}

/* mensagens */
#chatArea { display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; flex-direction: column; max-width: 86%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.agent { align-self: flex-start; align-items: flex-start; }
.msg-label {
  font-size: 9px; font-family: var(--font-mono);
  color: var(--text-dim); margin-bottom: 5px; padding: 0 4px;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.msg.user .msg-label { color: rgba(0,240,200,0.35); }
.msg-bubble { padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.7; }
.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #080c10; font-weight: 500; border-bottom-right-radius: 2px;
  box-shadow: 0 4px 20px var(--accent-glow);
}
.msg.agent .msg-bubble {
  background: var(--surface2); color: var(--text);
  border-bottom-left-radius: 2px; border: 1px solid var(--border2);
}

/* pdf bubble */
.pdf-bubble {
  background: var(--surface2); border: 1px solid rgba(0,240,200,0.25);
  border-radius: 8px; border-bottom-right-radius: 2px;
  padding: 10px 14px; display: flex; align-items: center; gap: 10px; max-width: 240px;
}
.pdf-icon {
  width: 34px; height: 34px; flex-shrink: 0;
  background: var(--accent-subtle); border-radius: 6px;
  border: 1px solid rgba(0,240,200,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.pdf-info { flex: 1; min-width: 0; }
.pdf-name { font-size: 11px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pdf-sub { font-size: 9px; color: var(--accent); margin-top: 2px; font-family: var(--font-mono); letter-spacing: 0.05em; }

/* typing */
.typing {
  display: flex; align-items: center; gap: 6px; padding: 13px 16px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 8px; border-bottom-left-radius: 2px;
}
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.4s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.15;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }

/* input bar */
.input-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(8,12,16,0.97); border-top: 1px solid var(--border2);
  backdrop-filter: blur(16px); padding: 10px 20px 18px;
}
.input-bar::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.25;
}
.pdf-pending {
  display: none; align-items: center; gap: 8px;
  max-width: 780px; margin: 0 auto 8px; padding: 6px 12px; border-radius: 4px;
  background: var(--accent-subtle); border: 1px solid rgba(0,240,200,0.2);
  font-size: 10px; font-family: var(--font-mono); color: var(--accent); letter-spacing: 0.04em;
}
.pdf-pending.active { display: flex; }
.remove-pdf { margin-left: auto; cursor: pointer; color: var(--text-muted); font-size: 15px; line-height: 1; transition: color 0.15s; }
.remove-pdf:hover { color: #ff5555; }
.input-inner { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
.upload-btn {
  width: 42px; height: 42px; flex-shrink: 0; border-radius: 6px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.upload-btn:hover { border-color: var(--accent); background: var(--accent-subtle); box-shadow: 0 0 10px var(--accent-glow); }
.upload-btn svg { width: 16px; height: 16px; fill: var(--text-muted); }
.upload-btn:hover svg { fill: var(--accent); }
#fileInput { display: none; }
.msg-input {
  flex: 1; padding: 10px 15px; border-radius: 6px; border: 1px solid var(--border2);
  background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit;
  resize: none; min-height: 42px; max-height: 120px; outline: none; transition: all 0.2s; line-height: 1.5;
}
.msg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); background: var(--surface2); }
.msg-input::placeholder { color: var(--text-dim); }
.send-btn {
  width: 42px; height: 42px; flex-shrink: 0; border-radius: 6px; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  box-shadow: 0 2px 12px var(--accent-glow);
}
.send-btn:hover { transform: scale(1.06); box-shadow: 0 4px 20px var(--accent-glow); }
.send-btn:active { transform: scale(0.96); }
.send-btn svg { width: 16px; height: 16px; fill: #080c10; }
.footer-note { font-size: 9px; font-family: var(--font-mono); color: var(--text-dim); text-align: center; margin-top: 8px; letter-spacing: 0.06em; }

@media (max-width: 480px) {
  .msg { max-width: 92%; }
  .header-badge { display: none; }
  .header-logo { height: 30px; }
  .login-card { padding: 30px 24px; }
}

  /* ---- Rich message formatting ---- */
  .msg-h1 {
    font-size: 14px; font-weight: 700; color: var(--accent);
    margin: 10px 0 4px; letter-spacing: 0.02em;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--accent-subtle);
  }
  .msg-h2 {
    font-size: 13px; font-weight: 700; color: var(--text);
    margin: 10px 0 3px; letter-spacing: 0.01em;
  }
  .msg-h3 {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    margin: 8px 0 2px; letter-spacing: 0.01em;
  }
  .msg-section {
    font-size: 12px; font-weight: 700;
    color: var(--accent); margin: 12px 0 5px;
    text-transform: uppercase; letter-spacing: 0.08em;
    display: flex; align-items: center; gap: 8px;
  }
  .msg-section::before {
    content: ''; display: inline-block;
    width: 3px; height: 12px; border-radius: 2px;
    background: var(--accent); flex-shrink: 0;
  }
  .msg-list {
    margin: 4px 0 4px 4px;
    padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 4px;
  }
  .msg-list li {
    padding-left: 14px; position: relative;
    font-size: 13px; line-height: 1.6; color: var(--text);
  }
  .msg-list li::before {
    content: ''; position: absolute; left: 0; top: 9px;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); opacity: 0.7;
  }
  .msg-list-num li::before {
    content: counter(li-counter);
    counter-increment: li-counter;
    background: none; width: auto; height: auto;
    top: 0; font-size: 11px; font-family: var(--font-mono);
    color: var(--accent); font-weight: 700; opacity: 1;
  }
  .msg-list-num { counter-reset: li-counter; }
  .msg-divider {
    height: 1px; background: var(--border2);
    margin: 10px 0; border-radius: 1px;
  }
  .msg-gap { height: 6px; }

</style>
</head>
<body>

<!-- ===================== TELA DE LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <img class="login-logo" id="loginLogo" src="" alt="Logo">
    <div class="login-title" id="loginTitle"></div>
    <div class="login-sub" id="loginSub"></div>
    <div class="field">
      <label>Seu nome</label>
      <input type="text" id="inputName" placeholder="Como posso te chamar?" autocomplete="off"
        onkeydown="if(event.key==='Enter') document.getElementById('inputPassword').focus()">
    </div>
    <div class="field">
      <label>Senha de acesso</label>
      <div style="position:relative;">
        <input type="password" id="inputPassword" placeholder="••••••••" autocomplete="off"
          style="padding-right:42px;width:100%;"
          onkeydown="if(event.key==='Enter') tryLogin()">
        <button onclick="togglePass()" type="button" tabindex="-1"
          style="position:absolute;right:0;top:0;bottom:0;width:42px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:color 0.2s;"
          onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">
          <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="login-btn" onclick="tryLogin()" id="loginBtn">ACESSAR</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-footer" id="loginFooter"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div class="header">
  <img class="header-logo" id="headerLogo" src="" alt="Logo">
  <div class="header-sep"></div>
  <div class="header-info">
    <div class="header-name" id="headerName"></div>
    <div class="header-sub">
      <span class="pulse-dot"></span>
      <span id="headerSub"></span>
    </div>
  </div>
  <span class="header-badge" id="headerBadge"></span>
</div>

<div class="main">
  <div class="chips" id="chipsContainer"></div>
  <div id="chatScroll" style="display:flex;flex-direction:column;gap:14px;">
    <div class="welcome-card">
      <div class="welcome-title" id="welcomeTitle"></div>
      <div class="welcome-sub" id="welcomeSub"></div>
      <div class="welcome-tags" id="welcomeTags"></div>
    </div>
    <div id="chatArea"></div>
  </div>
</div>

<div class="input-bar">
  <div class="pdf-pending" id="pdfPendingBar">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>
    <span id="pdfPendingName"></span>
    <span class="remove-pdf" onclick="removePdf()">×</span>
  </div>
  <div class="input-inner">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="Enviar PDF">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>
    </button>
    <input type="file" id="fileInput" accept=".pdf" onchange="handlePdf(event)">
    <textarea class="msg-input" id="userInput" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
    <button class="send-btn" onclick="sendMsg()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <p class="footer-note" id="footerNote"></p>
</div>

<script>
/* ============================================================
   ██████████████████████████████████████████████████████████
   ██                                                      ██
   ██   ZONA DE CONFIGURAÇÃO — EDITE APENAS AQUI          ██
   ██                                                      ██
   ██████████████████████████████████████████████████████████
   ============================================================ */

const CONFIG = {

  /* ---------- IDENTIDADE ---------- */
  agentName:   "Silvia — Simia ABNT",

let clientName = '';
let history    = [];
let pendingPdfB64  = null;
let pendingPdfName = null;

// Aplicar cores
function applyColors() {
  if (!CONFIG.colors) return;
  const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const [ar,ag,ab] = hex2rgb(CONFIG.colors.accent);
  const r = document.documentElement.style;
  r.setProperty('--accent',        CONFIG.colors.accent);
  r.setProperty('--accent-dark',   CONFIG.colors.accentDark);
  r.setProperty('--accent-glow',   `rgba(${ar},${ag},${ab},0.18)`);
  r.setProperty('--accent-subtle', `rgba(${ar},${ag},${ab},0.06)`);
  r.setProperty('--bg',            CONFIG.colors.bg);
  r.setProperty('--surface',       CONFIG.colors.surface);
}

// Inicializar login screen
function initLogin() {
  applyColors();
  const L = CONFIG.login;
  const logo = document.getElementById('loginLogo');
  if (CONFIG.logoBase64) logo.src = 'data:image/png;base64,' + CONFIG.logoBase64;
  else logo.style.display = 'none';
  document.getElementById('loginTitle').textContent  = L.title;
  document.getElementById('loginSub').textContent    = L.subtitle;
  document.getElementById('loginFooter').textContent = L.footer;
  document.getElementById('inputName').focus();
}

// Tentar login
function tryLogin() {
  const nameVal = document.getElementById('inputName').value.trim();
  const passVal = document.getElementById('inputPassword').value.trim();
  const errEl   = document.getElementById('loginError');
  const card    = document.querySelector('.login-card');

  errEl.classList.remove('show');

  if (!nameVal) {
    showLoginError(CONFIG.login.emptyNameMsg, card);
    return;
  }
  if (!passVal) {
    showLoginError(CONFIG.login.emptyPassMsg, card);
    document.getElementById('inputPassword').focus();
    return;
  }

  const valid = CONFIG.login.passwords.some(p => p.password === passVal);
  if (!valid) {
    showLoginError(CONFIG.login.errorMsg, card);
    document.getElementById('inputPassword').value = '';
    document.getElementById('inputPassword').focus();
    return;
  }

  // Sucesso
  clientName = nameVal;
  enterApp();
}

function showLoginError(msg, card) {
  const errEl = document.getElementById('loginError');
  errEl.textContent = msg;
  errEl.classList.add('show');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
}

// Entrar no app
function enterApp() {
  const loginScreen = document.getElementById('loginScreen');
  loginScreen.classList.add('fade-out');
  setTimeout(() => loginScreen.style.display = 'none', 500);

  document.title = CONFIG.pageTitle;

  // Header
  const logo = document.getElementById('headerLogo');
  if (CONFIG.logoBase64) logo.src = 'data:image/png;base64,' + CONFIG.logoBase64;
  else logo.style.display = 'none';
  document.getElementById('headerName').textContent = CONFIG.agentName;
  document.getElementById('headerSub').textContent  = CONFIG.agentRole;
  document.getElementById('headerBadge').textContent = CONFIG.badgeText;
  document.getElementById('footerNote').textContent  = CONFIG.footerNote;
  document.getElementById('userInput').placeholder   = CONFIG.inputPlaceholder;

  // Welcome (substitui {nome})
  const name = clientName;
  document.getElementById('welcomeTitle').textContent = CONFIG.welcomeTitle.replace('{nome}', name);
  document.getElementById('welcomeSub').innerHTML     = CONFIG.welcomeText.replace(/\{nome\}/g, name);

  // Tags
  const tagsEl = document.getElementById('welcomeTags');
  CONFIG.welcomeTags.forEach(t => {
    const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tagsEl.appendChild(s);
  });

  // Chips
  const chipsEl = document.getElementById('chipsContainer');
  CONFIG.chips.forEach(ch => {
    const b = document.createElement('button'); b.className = 'chip';
    b.textContent = ch.label; b.onclick = () => useChip(ch.text); chipsEl.appendChild(b);
  });
}

// ---- chat ----
function useChip(text) {
  document.getElementById('userInput').value = text;
  sendMsg();
}

function handlePdf(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    pendingPdfB64 = e.target.result.split(',')[1];
    pendingPdfName = file.name;
    document.getElementById('pdfPendingName').textContent = file.name;
    document.getElementById('pdfPendingBar').classList.add('active');
    document.getElementById('userInput').placeholder = CONFIG.inputPlaceholderPdf;
    document.getElementById('userInput').focus();
  };
  reader.readAsDataURL(file); event.target.value = '';
}

function removePdf() {
  pendingPdfB64 = pendingPdfName = null;
  document.getElementById('pdfPendingBar').classList.remove('active');
  document.getElementById('userInput').placeholder = CONFIG.inputPlaceholder;
}

async function sendMsg() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text && !pendingPdfB64) return;
  input.value = ''; input.style.height = 'auto';

  if (pendingPdfB64) {
    addPdfBubble(pendingPdfName);
    if (text) addMsg('user', clientName, text);
  } else {
    addMsg('user', clientName, text);
  }

  let msgContent;
  if (pendingPdfB64) {
    msgContent = [
      { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: pendingPdfB64 } },
      { type: 'text', text: text || 'Analise este projeto conforme as normas ABNT. Estruture: Resumo, Conformidades, Não Conformidades, Ausências e Recomendações.' }
    ];
  } else {
    msgContent = text;
  }

  history.push({ role: 'user', content: msgContent });
  const wasPdf = !!pendingPdfB64;
  removePdf();

  const typingEl = addTyping();
  scrollDown();

  const systemWithName = CONFIG.systemPrompt.replace(/\{nome\}/g, clientName);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        system: systemWithName,
        messages: history
      })
    });
    const data  = await res.json();
    const reply = data.content?.find(b => b.type === 'text')?.text || 'Não consegui processar. Tente novamente.';
    typingEl.remove();
    addMsg('agent', CONFIG.agentName.split('—')[0].trim(), reply);
    history[history.length - 1] = { role: 'user', content: wasPdf ? '[PDF] ' + (text || 'análise') : text };
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    typingEl.remove();
    addMsg('agent', CONFIG.agentName.split('—')[0].trim(), 'Erro de conexão. Tente novamente.');
  }
  scrollDown();
}

function addPdfBubble(name) {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div'); wrap.className = 'msg user';
  const lbl  = document.createElement('div'); lbl.className = 'msg-label'; lbl.textContent = clientName;
  const bub  = document.createElement('div'); bub.className = 'pdf-bubble';
  bub.innerHTML = `<div class="pdf-icon">📄</div><div class="pdf-info"><div class="pdf-name">${name}</div><div class="pdf-sub">PDF · PROJETO</div></div>`;
  wrap.appendChild(lbl); wrap.appendChild(bub); area.appendChild(wrap);
}

function addMsg(role, label, text) {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div'); wrap.className = 'msg ' + role;
  const lbl  = document.createElement('div'); lbl.className = 'msg-label'; lbl.textContent = label;
  const bub  = document.createElement('div'); bub.className = 'msg-bubble';
  bub.innerHTML = formatMsg(text);
  wrap.appendChild(lbl); wrap.appendChild(bub); area.appendChild(wrap);
  return wrap;
}


function formatMsg(raw) {
  let t = raw
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');

  const lines = t.split('\n');
  let html = '';
  let inList = false;
  let listType = '';

  const inlineFmt = s => s
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code style="background:rgba(0,240,200,0.08);padding:1px 5px;border-radius:3px;font-family:monospace;font-size:11px;">$1</code>');

  const closeList = () => { if (inList) { html += '</ul>'; inList = false; listType = ''; } };

  for (let line of lines) {
    // Headings
    if (/^### /.test(line)) {
      closeList();
      html += '<div class="msg-h3">' + inlineFmt(line.slice(4)) + '</div>';
    } else if (/^## /.test(line)) {
      closeList();
      html += '<div class="msg-h2">' + inlineFmt(line.slice(3)) + '</div>';
    } else if (/^# /.test(line)) {
      closeList();
      html += '<div class="msg-h1">' + inlineFmt(line.slice(2)) + '</div>';

    // Numbered section headers (e.g. "1) RESUMO GERAL" or "1. ITENS EM")
    } else if (/^\d+[\)\.]\s+[^\da-z]{3,}/.test(line.trim())) {
      closeList();
      html += '<div class="msg-section">' + inlineFmt(line) + '</div>';

    // Horizontal rule
    } else if (/^(-{3,}|_{3,}|\*{3,})$/.test(line.trim())) {
      closeList();
      html += '<div class="msg-divider"></div>';

    // Bullet list
    } else if (/^[-\*\u2022] /.test(line)) {
      if (!inList || listType !== 'ul') {
        closeList();
        html += '<ul class="msg-list">';
        inList = true; listType = 'ul';
      }
      html += '<li>' + inlineFmt(line.replace(/^[-\*\u2022] /, '')) + '</li>';

    // Numbered list (e.g. "1. item" with lowercase)
    } else if (/^\d+\. /.test(line) && /[a-záéíóú]/.test(line)) {
      if (!inList || listType !== 'ol') {
        closeList();
        html += '<ul class="msg-list msg-list-num">';
        inList = true; listType = 'ol';
      }
      html += '<li>' + inlineFmt(line.replace(/^\d+\. /, '')) + '</li>';

    // Empty line
    } else if (line.trim() === '') {
      closeList();
      html += '<div class="msg-gap"></div>';

    // Normal paragraph
    } else {
      closeList();
      html += '<p style="margin:2px 0;">' + inlineFmt(line) + '</p>';
    }
  }
  closeList();
  return html;
}

function addTyping() {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div'); wrap.className = 'msg agent';
  const lbl  = document.createElement('div'); lbl.className = 'msg-label'; lbl.textContent = CONFIG.agentName.split('—')[0].trim();
  const t    = document.createElement('div'); t.className = 'typing';
  t.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  wrap.appendChild(lbl); wrap.appendChild(t); area.appendChild(wrap);
  return wrap;
}

function scrollDown() {
  const s = document.getElementById('chatScroll');
  setTimeout(() => s.scrollTop = s.scrollHeight, 50);
}

function togglePass() {
  const input = document.getElementById('inputPassword');
  const icon  = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}
